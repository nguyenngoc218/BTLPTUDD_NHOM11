plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.btlptudd_nhm11'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.btlptudd_nhm11"
        minSdk 34
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    // Các dịch vụ sử dụng
    implementation 'com.google.firebase:firebase-auth' // Xác thực đăng nhập
    implementation 'com.google.firebase:firebase-firestore' // Cơ sở dữ liệu NoSQL
    implementation 'com.google.firebase:firebase-storage' // Lưu trữ hình ảnh

}